<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heritage Cut | Admin Panel</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #111;
            color: #f5f0e8;
            padding: 30px 5%;
        }

        h1 {
            margin-bottom: 10px;
            font-size: 32px;
        }

        .subtitle {
            color: #aaa;
            margin-bottom: 30px;
        }

        .gold {
            color: #c6a36b;
        }

        .box {
            max-width: 450px;
            margin: 70px auto;
            background: #1d1d1d;
            padding: 35px;
            border-radius: 12px;
            border: 1px solid #333;
        }

        input {
            width: 100%;
            padding: 14px;
            margin: 10px 0;
            background: #292929;
            color: white;
            border: 1px solid #444;
            border-radius: 6px;
        }

        button {
            cursor: pointer;
            padding: 11px 16px;
            border: none;
            border-radius: 5px;
            font-weight: bold;
        }

        .login-btn {
            width: 100%;
            background: #c6a36b;
            color: #111;
            margin-top: 15px;
        }

        .logout-btn {
            background: #333;
            color: white;
        }

        .dashboard {
            display: none;
        }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 30px;
        }

        .table-wrap {
            overflow-x: auto;
            background: #1d1d1d;
            border-radius: 10px;
            border: 1px solid #333;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 850px;
        }

        th, td {
            padding: 16px;
            text-align: left;
            border-bottom: 1px solid #333;
        }

        th {
            color: #c6a36b;
        }

        td {
            font-size: 14px;
        }

        .confirm {
            background: #286b43;
            color: white;
            margin: 3px;
        }

        .cancel {
            background: #8b3030;
            color: white;
            margin: 3px;
        }

        .status {
            font-weight: bold;
        }

        .message {
            margin-top: 15px;
            color: #c6a36b;
        }

        .empty {
            padding: 30px;
            text-align: center;
            color: #aaa;
        }

        @media(max-width: 600px) {
            body {
                padding: 20px 12px;
            }

            .top {
                align-items: flex-start;
            }
        }
    </style>
</head>

<body>

    <!-- LOGIN -->
    <div class="box" id="loginBox">
        <h1>Heritage <span class="gold">Cut</span></h1>
        <p class="subtitle">Administrator Login</p>

        <form id="loginForm">
            <input
                type="email"
                id="email"
                placeholder="Email address"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
                required
            >

            <button class="login-btn" type="submit">
                Log In
            </button>
        </form>

        <p class="message" id="loginMessage"></p>
    </div>


    <!-- DASHBOARD -->
    <div class="dashboard" id="dashboard">

        <div class="top">
            <div>
                <h1>Heritage <span class="gold">Cut</span></h1>
                <p class="subtitle">Booking Management</p>
            </div>

            <button class="logout-btn" id="logoutBtn">
                Log Out
            </button>
        </div>

        <h2 style="margin-bottom:20px;">Appointment Requests</h2>

        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>Customer</th>
                        <th>Phone</th>
                        <th>Barber</th>
                        <th>Service</th>
                        <th>Date</th>
                        <th>Time</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>

                <tbody id="bookingsTable"></tbody>
            </table>
        </div>

        <p class="message" id="dashboardMessage"></p>

        <button
            onclick="loadBookings()"
            style="margin-top:20px;background:#c6a36b;color:#111;"
        >
            Refresh Bookings
        </button>

    </div>


<script>
    const SUPABASE_URL = 'https://zqkrnnllqznseezlxlyo.supabase.co';

    const SUPABASE_KEY = 'sb_publishable_22sfkbflstpyAcPm-xDqsg_kmCISgOM';

    const ADMIN_UID = '322779e8-2fca-4b79-b5cf-1de4df79456e';

    const client = supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );

    const loginBox = document.getElementById('loginBox');
    const dashboard = document.getElementById('dashboard');

    // LOGIN
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const message = document.getElementById('loginMessage');

        message.textContent = 'Logging in...';

        const { data, error } = await client.auth.signInWithPassword({
            email,
            password
        });

        if (error) {
            message.textContent = error.message;
            return;
        }

        if (data.user.id !== ADMIN_UID) {
            await client.auth.signOut();
            message.textContent = 'You are not authorized to access this panel.';
            return;
        }

        showDashboard();
    });


    // SHOW DASHBOARD
    async function showDashboard() {
        loginBox.style.display = 'none';
        dashboard.style.display = 'block';

        await loadBookings();
    }


    // LOAD BOOKINGS
    async function loadBookings() {
        const table = document.getElementById('bookingsTable');
        const message = document.getElementById('dashboardMessage');

        table.innerHTML = '';
        message.textContent = 'Loading bookings...';

        const { data, error } = await client
            .from('bookings')
            .select('*')
            .order('created_at', { ascending: false });

        if (error) {
            message.textContent = 'Error loading bookings: ' + error.message;
            return;
        }

        if (!data || data.length === 0) {
            message.textContent = 'No bookings found yet.';
            return;
        }

        message.textContent = `${data.length} booking(s) found.`;

        data.forEach(booking => {
            const row = document.createElement('tr');

            const values = [
                booking.customer_name,
                booking.phone,
                booking.barber,
                booking.service,
                booking.appointment_date,
                booking.appointment_time,
                booking.status
            ];

            values.forEach((value, index) => {
                const cell = document.createElement('td');
                cell.textContent = value ?? '';
                if (index === 6) cell.className = 'status';
                row.appendChild(cell);
            });

            const actions = document.createElement('td');

            const confirmButton = document.createElement('button');
            confirmButton.textContent = 'Confirm';
            confirmButton.className = 'confirm';
            confirmButton.addEventListener('click', () => {
                updateStatus(booking.id, 'Confirmed');
            });

            const cancelButton = document.createElement('button');
            cancelButton.textContent = 'Cancel';
            cancelButton.className = 'cancel';
            cancelButton.addEventListener('click', () => {
                updateStatus(booking.id, 'Cancelled');
            });

            actions.appendChild(confirmButton);
            actions.appendChild(cancelButton);

            row.appendChild(actions);
            table.appendChild(row);
        });
    }


    // UPDATE BOOKING STATUS
    async function updateStatus(id, status) {
        const message = document.getElementById('dashboardMessage');

        message.textContent = 'Updating booking...';

        const { error } = await client
            .from('bookings')
            .update({ status: status })
            .eq('id', id);

        if (error) {
            message.textContent = 'Could not update booking: ' + error.message;
            return;
        }

        message.textContent = 'Booking updated successfully!';
        await loadBookings();
    }


    // LOG OUT
    document.getElementById('logoutBtn').addEventListener('click', async () => {
        await client.auth.signOut();

        dashboard.style.display = 'none';
        loginBox.style.display = 'block';
        document.getElementById('loginMessage').textContent = '';
    });


    // CHECK EXISTING SESSION
    async function checkSession() {
        const { data } = await client.auth.getSession();

        if (data.session) {
            if (data.session.user.id === ADMIN_UID) {
                showDashboard();
            } else {
                await client.auth.signOut();
            }
        }
    }

    checkSession();

</script>

</body>
</html>
